lor:transparent;vertical-align: middle;border-bottom: 1.5pt solid rgba(102, 102, 102, 1.00);border-top: 0 solid rgba(0, 0, 0, 1.00);border-left: 0 solid rgba(0, 0, 0, 1.00);border-right: 0 solid rgba(0, 0, 0, 1.00);margin-bottom:0;margin-top:0;margin-left:0;margin-right:0;}</style><table data-quarto-disable-processing="true" class="cl-d33d07d8"><thead><tr style="overflow-wrap:break-word;"><th class="cl-d33aa740"><p class="cl-d33a9476"><span class="cl-d3388cda">Module</span></p></th><th class="cl-d33aa74a"><p class="cl-d33a9476"><span class="cl-d3388cda">Intervention</span></p></th><th class="cl-d33aa74b"><p class="cl-d33a9476"><span class="cl-d3388cda">Placebo</span></p></th></tr></thead><tbody><tr style="overflow-wrap:break-word;"><td class="cl-d33aa754"><p class="cl-d33a9476"><span class="cl-d3388cda">Module 1</span></p></td><td class="cl-d33aa755"><p class="cl-d33a9476"><span class="cl-d3388cda">- Exercises on identifying personal values and future aspirations, enhancing treatment readiness and reducing resistance to change.</span><br><br><span class="cl-d3388cda">- Psychoeducation on improving decision-making by weighing long-term consequences over immediate rewards.</span><br><br><span class="cl-d3388cda">- Based on structured goal-setting techniques, participants transform abstract desires into specific, measurable, and achievable objectives, increasing self-efficacy and clarity about their own needs and personal values and enhancing treatment readiness.</span></p></td><td class="cl-d33aa75e"><p class="cl-d33a9476"><span class="cl-d3388cda">- Psychoeducational content promotes the benefits of physical activity, identifies personal barriers, and set achievable goals to build motivation for physical activity.</span><br><br><span class="cl-d3388cda">- The importance of motor skills, coordination, and balance, enhancing physical confidence and improving participation in daily and therapeutic activities is highlighted.</span><br><br><span class="cl-d3388cda">- Through guided exercises, participants are introduced to break sedentary patterns, to increase awareness of health risks and motivated for a sustainable, active living.</span></p></td></tr><tr style="overflow-wrap:break-word;"><td class="cl-d33aa754"><p class="cl-d33a9476"><span class="cl-d3388cda">Module 2</span></p></td><td class="cl-d33aa755"><p class="cl-d33a9476"><span class="cl-d3388cda">- Development of skills to build trust and collaborative working relationships with supervision officers, reducing resistance against community supervision and improving adherence to supervision mandates.</span><br><br><span class="cl-d3388cda">- Identification of trauma- and fear-based avoidance patterns that interfere with engagement in community supervision, using cognitive-behavioral strategies to enhance compliance with structured interventions.</span><br><br><span class="cl-d3388cda">- Through guided exercises, participants examine the impact of adult relationships on emotional regulation and behavioral stability, targeting deficits in capacity for adult intimacy.</span></p></td><td class="cl-d33aa75e"><p class="cl-d33a9476"><span class="cl-d3388cda">- Psychoeducation provides the basics of muscle structure and function, increasing self-awareness of physical capabilities and enhancing motivation to engage in structured physical routines.</span><br><br><span class="cl-d3388cda">- in guided exercises, intrinsic and extrinsic motivators are identified as well as barriers like low confidence or time constraints that affect adherence on personal training plans.</span><br><br><span class="cl-d3388cda">- By reflecting on personal sport preferences in exercises, participants recognize how peer or cultural influences may shape physical activity choices, reducing susceptibility to negative social pressures.</span></p></td></tr><tr style="overflow-wrap:break-word;"><td class="cl-d33aa75f"><p class="cl-d33a9476"><span class="cl-d3388cda">Module 3</span></p></td><td class="cl-d33aa760"><p class="cl-d33a9476"><span class="cl-d3388cda">- Identification of emotions as indicators of unmet personal needs, reducing impulsive reactions by linking affective states to underlying psychological demands.</span><br><br><span class="cl-d3388cda">- Through mindfulness exercises and case examples, participants learn the importance of non-reactive awareness of emotions and connected bodily sensations, improving impulse control and reducing maladaptive coping.</span><br><br><span class="cl-d3388cda">- Differentiation of emotional experiences and action urges using tools like the tension scale, fostering pause-and-reflect strategies to interrupt impulsive behaviors.</span><br><br><span class="cl-d3388cda">- Creation of a personalized skill set, with adaptive, individualized responses to emotional distress, enhancing long-term emotional regulation and self-management.</span></p></td><td class="cl-d33aa768"><p class="cl-d33a9476"><span class="cl-d3388cda">- Psychoeducation promotes that sleep quality directly influences emotional regulation, cognitive function, and physical health, addressing impulsivity and emotional dysregulation that undermine sleep hygiene.</span><br><br><span class="cl-d3388cda">- Understanding sleep cycles and physiological restoration helps link poor sleep to heightened stress, supporting those with external or sexualized coping patterns in developing healthier responses.</span><br><br><span class="cl-d3388cda">- Practical, non-drug strategies are taught in exercises to manage shift work and jetlag, promoting consistent routines and environmental adjustments that support long-term sleep stability.</span></p></td></tr><tr style="overflow-wrap:break-word;"><td class="cl-d33aa75f"><p class="cl-d33a9476"><span class="cl-d3388cda">Module 4</span></p></td><td class="cl-d33aa760"><p class="cl-d33a9476"><span class="cl-d3388cda">- Psychoeducation on problem-solving deficits as a core component of self-regulation difficulties, understanding that challenges are manageable through structured, cognitive-behavioral approaches.</span><br><br><span class="cl-d3388cda">- Guided exercises following the 7-Step Problem-Solving Plan to systematically identify, define, and address problems, enhancing decision-making and reducing impulsive or avoidant reactions.</span><br><br><span class="cl-d3388cda">- Through video examples and case studies, participants practice distinguishing between changeable and unchangeable issues, generating realistic solutions, and evaluating outcomes.</span></p></td><td class="cl-d33aa768"><p class="cl-d33a9476"><span class="cl-d3388cda">- Psychoeducational content focus on the neuroscience of dreaming, including REM and non-REM sleep stages.</span><br><br><span class="cl-d3388cda">- Through exercises like dream journaling, and symbolic interpretation, participants develop reflective practices that enhance awareness of dreams.</span><br><br><span class="cl-d3388cda">- The module links stress, sleep disruption, and dream content, illustrating how chronic stress undermines executive function and exacerbates difficulties in structured thinking and solution generation.</span><br><br><span class="cl-d3388cda">- Case studies highlight trauma-related dream patterns, showing how unresolved psychological distress and poor sleep hinder insight and cognitive restoration.</span></p></td></tr><tr style="overflow-wrap:break-word;"><td class="cl-d33aa75f"><p class="cl-d33a9476"><span class="cl-d3388cda">Module 5</span></p></td><td class="cl-d33aa760"><p class="cl-d33a9476"><span class="cl-d3388cda">- Identifaction of three offense-supportive cognitive distortions, such as rationalizations that minimize harm, which perpetuate antisocial thinking and increase reoffending risk (overall 16 pre-defined offense-supportive cognitions).</span><br><br><span class="cl-d3388cda">- Psychoeducation on how offense-supportive cognitions arise from selective attention to partial truths, reinforcing denial and minimizing consequences through psychological defense mechanisms.</span><br><br><span class="cl-d3388cda">- Through cognitive restructuring, participants challenge distorted beliefs and promoting critical evaluation of harmful thought patterns in guided exercises.</span><br><br><span class="cl-d3388cda">- Case studies and video examples illustrate real-world consequences of distorted thinking, bridging the gap between perceived justification and actual harm.</span></p></td><td class="cl-d33aa768"><p class="cl-d33a9476"><span class="cl-d3388cda">- Psychoeducation provides foundational knowledge of nutrition, digestion, and the mind-body connection.</span><br><br><span class="cl-d3388cda">- Through guided exercises, participants explore ethical, health, and environmental motivations for three out of 6 different nutrition types (e.g. plant-based diets, fostering empathy and prosocial decision-making).</span><br><br><span class="cl-d3388cda">- Practical skills in meal planning and grocery shopping build confidence and sustainability, empowering lasting dietary changes that enhance psychological health and reduce behavioral risk.</span></p></td></tr><tr style="overflow-wrap:break-word;"><td class="cl-d33aa769"><p class="cl-d33a9476"><span class="cl-d3388cda">Module 6</span></p></td><td class="cl-d33aa76a"><p class="cl-d33a9476"><span class="cl-d3388cda">- Psychoeducation focus on the differentiation between healthy and problematic sexual interests and on how sexual preoccupation can increase reoffending risk.</span><br><br><span class="cl-d3388cda">- The module addresses emotional congruence with children as a potential risk factor, emphasizing the importance of maintaining emotional and physical boundaries between oneself and children to reduce relapse potential (relapse prevention).</span><br><br><span class="cl-d3388cda">- Cognitive restructuring techniques are used to challenge distorted beliefs about sexual behavior, fostering insight and promoting adaptive, non-harmful thought patterns.</span><br><br><span class="cl-d3388cda">- Through identification of high-risk triggers and personalized coping strategies, the self-regulation, self-efficacy, and control over problematic sexual urges and fantasies will be focused.</span></p></td><td class="cl-d33aa772"><p class="cl-d33a9476"><span class="cl-d3388cda">- Psychological well-being is distinguished from happiness, focusing on meaning, inner balance, and personal growth, explored through reflections on identity, nature, music, and laughter.</span><br><br><span class="cl-d3388cda">- Participants challenge the myth of universal well-being, recognizing its subjective nature and the importance of personal values, identity, and life context in shaping health and satisfaction.</span><br><br><span class="cl-d3388cda">- Through exercises, participants explore the gut-brain axis, mindful eating, and hygiene practices, linking nutrition, self-care, and bodily awareness to mental clarity and psychological stability.</span></p></td></tr></tbody></table></div>

      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
