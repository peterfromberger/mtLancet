name: frpQuarto
title: "FRP Manuscript Format"
author: "Dr. Peter Fromberger"
version: 0.1.5
quarto-required: ">=1.5.0"

contributes:
  shortcodes: 
    - summary.lua
    - acknowledgements.lua
    - contributors.lua
    - datasharing_statement.lua
    - declaration_of_interests.lua

  filters:
    - summary_wordcount.lua